name: "Prism"
run-name: "TALC"
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  pages: write
  id-token: write
  contents: read
jobs:
  peridot:
    concurrency:
      group: "MARIGOLD-${{ github.workflow }}"
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    environment:
      name: "github-pages"
      url: ${{ steps.Otter.outputs.page_url }}
    steps:
      - name: "sedge"
        uses: actions/checkout@v6
      - name: "CANYON"
        uses: actions/configure-pages@v6
      - name: "raven"
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.workspace }}
      - name: "coral"
        id: Otter
        uses: actions/deploy-pages@v5
